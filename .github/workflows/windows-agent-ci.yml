name: windows-agent-ci

on:
  push:
    paths: ['windows-agent/**']
  pull_request:
    paths: ['windows-agent/**']

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build
        run: dotnet build PcRemoteAgent.csproj --nologo
      - name: Test
        run: dotnet test PcRemoteAgent.Tests/PcRemoteAgent.Tests.csproj --nologo