name: windows-agent-ci

on:
  push:
    branches: [main]
    paths: ['windows-agent/**', '.github/workflows/windows-agent-ci.yml']
  pull_request:
    paths: ['windows-agent/**', '.github/workflows/windows-agent-ci.yml']

jobs:
  build-test-publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-agent
    env:
      DIST: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          cache: true
          cache-dependency-path: windows-agent/PcRemoteAgent.csproj

      - name: Restore
        run: dotnet restore PcRemoteAgent.csproj
      - name: Build
        run: dotnet build PcRemoteAgent.csproj --no-restore --nologo
      - name: Test
        run: dotnet test PcRemoteAgent.Tests/PcRemoteAgent.Tests.csproj --no-restore --nologo

      - name: Publish win-x64 (self-contained single-file)
        run: >
          dotnet publish PcRemoteAgent.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:Version="0.1.3-ci.${{ github.run_number }}" --nologo

      - name: Validate published executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:DIST | Out-Null
          # TFM-scoped path (net8.0-windows) — match any TFM to survive upgrades.
          $published = Get-ChildItem "bin/Release/*/win-x64/publish/PcRemoteAgent.exe" | Select-Object -First 1
          if (-not $published) { throw "published PcRemoteAgent.exe not found" }
          Copy-Item $published.FullName "$env:DIST/PC-Remote-Agent-win-x64.exe"
          $exe = Get-Item "$env:DIST/PC-Remote-Agent-win-x64.exe"
          if ($exe.Length -lt 10MB) { throw "published exe is unexpectedly small ($($exe.Length) bytes)" }
          # Smoke: start, confirm the WSS port binds, stop (listen-only — no input injected).
          $proc = Start-Process $exe.FullName -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              $ok = (Test-NetConnection -ComputerName 127.0.0.1 -Port 58642 -WarningAction SilentlyContinue).TcpTestSucceeded
              if ($ok) { break }
            }
            if (-not $ok) { throw "agent did not open port 58642 within 20s" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-windows-agent-win-x64
          path: windows-agent/dist/PC-Remote-Agent-win-x64.exe
          if-no-files-found: error
