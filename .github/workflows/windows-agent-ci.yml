name: windows-agent-ci

on:
  push:
    branches: [main]
    paths: ['windows-agent/**', '.github/workflows/windows-agent-ci.yml']
  pull_request:
    paths: ['windows-agent/**', '.github/workflows/windows-agent-ci.yml']

jobs:
  test:
    name: Build + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          cache: true
          cache-dependency-path: windows-agent/src/PcRemote.Core/PcRemote.Core.csproj

      - name: Restore
        run: dotnet restore PcRemoteAgent.slnx
      - name: Build
        run: dotnet build PcRemoteAgent.slnx --no-restore --nologo
      - name: Test
        run: dotnet test src/PcRemote.Tests/PcRemote.Tests.csproj --no-restore --no-build --nologo

  installer:
    name: Installer build (staging + ISCC) + smoke test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          cache: true
          cache-dependency-path: windows-agent/src/PcRemote.Core/PcRemote.Core.csproj

      - name: Build installer (unsigned in CI; signing in release)
        shell: pwsh
        run: ./installer/build.ps1

      - name: Smoke test — service console mode binds WSS port
        shell: pwsh
        run: |
          $svc = "installer/staging/PCRemoteService.exe"
          if (-not (Test-Path $svc)) { throw "staged PCRemoteService.exe not found" }
          # Console mode runs the same code path as the service without SCM.
          $proc = Start-Process (Resolve-Path $svc) -ArgumentList "--console" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              $ok = (Test-NetConnection -ComputerName 127.0.0.1 -Port 58642 -WarningAction SilentlyContinue).TcpTestSucceeded
              if ($ok) { break }
            }
            if (-not $ok) { throw "service did not open port 58642 within 20s" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-windows-installer
          path: windows-agent/dist/PC-Remote-Setup.exe
          if-no-files-found: error
