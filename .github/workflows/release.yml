name: release

# Tag-triggered release: build and validate both platforms, then publish
# the GitHub Release with checksums. Windows produces PC-Remote-Setup.exe
# (signed when signing secrets are configured) plus a SHA-256 sidecar.
# A failed platform blocks the release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Build + test
        run: |
          dotnet restore PcRemoteAgent.slnx
          dotnet build PcRemoteAgent.slnx --no-restore --nologo
          dotnet test src/PcRemote.Tests/PcRemote.Tests.csproj --no-restore --no-build --nologo

      - name: Build installer
        id: build
        shell: pwsh
        env:
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          ./installer/build.ps1
          -Version "$env:RELEASE_VERSION"
        # WINDOWS_CERT_PATH/PASSWORD may point to a keyfile checked into the
        # secret store; when absent the build warns and ships unsigned.

      # The secrets context is not available in step-level `if:` — the
      # certificate presence check happens inside the script via env instead.
      - name: Validate staged executables (signature/publisher/version)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
        run: |
          if (-not $env:WINDOWS_CERT_PATH) {
            # A tag build is a production release: it must not ship unsigned
            # (development builds built by windows-agent-ci may).
            throw "No signing certificate configured (WINDOWS_CERT_PATH secret); refusing to publish an unsigned production release."
          }
          $staged = @("PCRemoteService.exe","PCRemoteInput.exe","PCRemoteTray.exe") |
            ForEach-Object { Get-AuthenticodeSignature "installer/staging/$_" }
          $invalid = $staged | Where-Object { $_.Status -ne 'Valid' }
          if ($invalid) { $invalid | ForEach-Object { throw "invalid signature: $($_.Path)" } }
          ./installer/Validate-Release.ps1 -Path "dist/PC-Remote-Setup.exe" `
            -ExpectedVersion "$env:RELEASE_VERSION"

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem "dist/PC-Remote-Setup.exe"
          if (-not $setup) { throw "installer missing" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "dist/PC-Remote-Setup.exe.sha256" -Value "$hash  PC-Remote-Setup.exe" -NoNewline
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Smoke test — installer present and service exe staged
        shell: pwsh
        run: |
          if ((Get-Item "installer/staging/PCRemoteService.exe").Length -lt 100KB) { throw "service exe unexpectedly small" }
          if ((Get-Item "installer/staging/PCRemoteTray.exe").Length -lt 100KB) { throw "tray exe unexpectedly small" }

      - uses: actions/upload-artifact@v4
        with:
          name: pc-remote-windows-installer
          path: |
            windows-agent/dist/PC-Remote-Setup.exe
            windows-agent/dist/PC-Remote-Setup.exe.sha256
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so versionCode = commit count is deterministic.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4

      - name: Compute version from tag
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A tag build is a production release: it must not ship unsigned
          # (development builds built by android-app-ci may).
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret set — refusing to publish an unsigned production release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build and test
        run: >
          ./gradlew clean :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}
          --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Validate and stage APK
        run: |
          mkdir -p dist
          apk="app/build/outputs/apk/release/PC-Remote-Android-release.apk"
          [ -s "$apk" ] || { echo "missing or empty: $apk"; exit 1; }
          cp "$apk" dist/PC-Remote-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pc-remote-android
          path: android-app/dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum PC-Remote-Setup.exe PC-Remote-Android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot detect the repo from a
          # git remote — set it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "PC Remote $TAG"
            echo ""
            echo "## Windows"
            echo "- \`PC-Remote-Setup.exe\` — full installer (installs the PCRemoteService Windows service, tray UI and the input helper to Program Files). Install once; the PC is then always reachable, including before logon and after reboot."
            echo "- \`PC-Remote-Setup.exe.sha256\` — SHA-256 digest of the installer."
            echo ""
            echo "## Android"
            echo "- \`PC-Remote-Android.apk\` — Android app"
            echo ""
            echo "## Security"
            echo "- Local-network only (private firewall profiles, local subnet scope); WSS (TLS) mandatory, no plaintext fallback."
            echo "- Trust-on-first-use certificate pinning with a stable PC identity; IP/DHCP changes do not force re-pairing."
            echo "- Pairing codes rotate every minute; the tray autostart runs elevated so it can display them; input/authentication state is owned by the Windows service, not a user process."
            echo ""
            echo "## Verification"
            echo "- SHA-256 checksums: \`SHA256SUMS.txt\`"
          } > notes.md
          ls -la dist
          if ! out=$(gh release create "$TAG" --verify-tag \
               --title "PC Remote $TAG" --notes-file notes.md dist/* 2>&1); then
            echo "$out"
            # Surface the raw error as an annotation so it is visible via the
            # public check-run API without signing in.
            echo "::error::gh release create failed: ${out:0:700}"
            exit 1
          fi
          echo "$out"
